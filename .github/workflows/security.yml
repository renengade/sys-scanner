name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  gosec:
    name: Static analysis (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: gosec (linux/darwin)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...
      - name: gosec (windows)
        run: GOOS=windows go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...
      - name: go vet
        run: go vet ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
